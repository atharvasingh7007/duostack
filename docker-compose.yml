version: "3.8"

services:
  duostack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duostack-engine
    restart: unless-stopped
    ports:
      - "3747:3747"
    environment:
      - PORT=3747
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DUOSTACK_PROJECT_PATH=/project
    volumes:
      # Mount state and decisions for persistence across container restarts
      - ./.duostack:/project/.duostack
      # Mount optional codebase index
      - ./stacklit.json:/project/stacklit.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3747/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
